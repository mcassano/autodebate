[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodebate"
version = "0.3.0"
description = "Eavesdrop on three brilliant LLM minds arguing in a coffee shop — and pull up a chair."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "mcassano" }]
keywords = ["llm", "debate", "tui", "multi-agent", "openrouter"]
dependencies = [
    "textual>=1.0",
    "openai>=1.60",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
autodebate = "autodebate.cli:main"
autodebate-web = "autodebate.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodebate"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
